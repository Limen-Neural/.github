# =============================================================================
# Reusable Rust Coverage Workflow — Limen-Neural
# =============================================================================
# Generates LCOV coverage with cargo-llvm-cov and uploads to Codecov.
#
# Design decisions:
#   - Uses cargo-llvm-cov (the standard for Rust coverage) instead of tarpaulin
#   - LCOV format for Codecov compatibility
#   - llvm-tools-preview component required by cargo-llvm-cov
#   - Coverage runs on a single OS (Linux) since cross-platform coverage is redundant
#   - Token passed via secrets (not env) to avoid leakage in logs
#
# Caller example:
#   jobs:
#     coverage:
#       uses: Limen-Neural/.github/.github/workflows/rust-coverage.yml@main
#       secrets:
#         codecov-token: ${{ secrets.CODECOV_TOKEN }}
# =============================================================================

name: Rust Coverage

on:
  workflow_call:
    inputs:
      features:
        description: "Cargo feature flags (--all-features, --no-default-features, --features foo,bar)"
        type: string
        default: "--all-features"
      toolchain:
        description: "Rust toolchain to use"
        type: string
        default: "stable"
    secrets:
      CODECOV_TOKEN:
        description: "Codecov upload token"
        required: true

permissions:
  contents: read

concurrency:
  group: rust-cov-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (engram-parser)
        with:
          toolchain: ${{ inputs.toolchain }}
          components: llvm-tools-preview

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (engram-parser)
        with:
          key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2 (engram-parser)
        with:
          tool: cargo-llvm-cov

      - name: Generate LCOV coverage
        run: cargo llvm-cov ${{ inputs.features }} --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5 (engram-parser)
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
