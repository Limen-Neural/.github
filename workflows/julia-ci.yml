# =============================================================================
# Reusable Julia CI Workflow — Limen-Neural
# =============================================================================
# Runs Julia package tests across a version matrix.
#
# Design decisions:
#   - Version matrix defaults to 1.10 (LTS) through 1.12 (current stable)
#   - Uses julia-actions ecosystem (setup-julia, cache, buildpkg, runtest)
#   - SHA-pinned actions (Aikido supply-chain policy)
#   - persist-credentials: false on checkout
#   - Concurrency groups with cancel-in-progress
#   - fail-fast: false so one version failure doesn't cancel the others
#   - os input defaults to ubuntu-latest (cross-platform is rarely needed)
#
# Caller example:
#   jobs:
#     ci:
#       uses: Limen-Neural/.github/.github/workflows/julia-ci.yml@main
#       with:
#         julia-versions: '["1.10", "1.11", "1.12"]'
# =============================================================================

name: Julia CI

on:
  workflow_call:
    inputs:
      julia-versions:
        description: "JSON array of Julia versions to test"
        type: string
        default: '["1.10", "1.11", "1.12"]'
      os:
        description: "Runner OS"
        type: string
        default: "ubuntu-latest"
      format-check:
        description: "Run JuliaFormatter check"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: julia-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }}
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ${{ fromJson(inputs.julia-versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia packages
        uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3.1.0

      - name: Build package
        uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0

      - name: Run tests
        uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1.12.0

  format-check:
    name: Format Check
    if: inputs.format-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1"

      - name: Check formatting
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.add("JuliaFormatter")
          using JuliaFormatter
          # Format check: src/ and test/ directories
          dirs = filter(isdir, ["src", "test", "ext"])
          if isempty(dirs)
            @info "No source directories found, skipping format check"
            exit(0)
          end
          formatted = format(dirs; verbose=true, overwrite=false)
          if !formatted
            @error "Formatting check failed. Run 'using JuliaFormatter; format([\"src\", \"test\"])' locally."
            exit(1)
          end
          @info "Format check passed"
