# =============================================================================
# Reusable Julia Coverage Workflow — Limen-Neural
# =============================================================================
# Runs Julia tests with coverage, processes results, and uploads to Codecov.
#
# Design decisions:
#   - Uses Julia's built-in coverage (Pkg.test with coverage=true)
#   - julia-processcoverage to convert Julia coverage to LCOV format
#   - Single Julia version for coverage (latest stable by default)
#   - Token passed via secrets to avoid leakage
#
# Caller example:
#   jobs:
#     coverage:
#       uses: Limen-Neural/.github/.github/workflows/julia-coverage.yml@main
#       secrets:
#         codecov-token: ${{ secrets.CODECOV_TOKEN }}
# =============================================================================

name: Julia Coverage

on:
  workflow_call:
    inputs:
      julia-version:
        description: "Julia version for coverage run"
        type: string
        default: "1"
    secrets:
      CODECOV_TOKEN:
        description: "Codecov upload token"
        required: true

permissions:
  contents: read

concurrency:
  group: julia-cov-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: ${{ inputs.julia-version }}

      - name: Cache Julia packages
        uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3.1.0

      - name: Build package
        uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0

      - name: Run tests with coverage
        uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1.12.0
        with:
          coverage: true

      - name: Process coverage
        uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1.2.2

      - name: Upload to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5 (engram-parser)
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
